name: task-manager-dev

services:
  db:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - task-manager-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: yarn workspace task-manager-backend exec prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: yarn workspace task-manager-backend dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      UPLOAD_DIR: /app/backend/uploads
    ports:
      - "${BACKEND_PORT}:3000"
    volumes:
      - task-manager-uploads:/app/backend/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  task-manager-postgres:
    name: task-manager-dev-postgres
  task-manager-uploads:
    name: task-manager-dev-uploads
